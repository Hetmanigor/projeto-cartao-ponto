<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cartão Ponto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bater Ponto</h1>
        <div class="relogio" id="relogio">00:00:00</div>
        <div class="botoes">
            <button class="btn entrada" onclick="registrarPonto('Entrada')">Registrar Entrada</button>
            <button class="btn saida" onclick="registrarPonto('Saída')">Registrar Saída</button>
        </div>
        <div class="historico-container">
            <h2>Histórico de Registros</h2>
            <table id="tabela-historico">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Data/Hora</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
